<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21272D"/>
      <stop offset="50%" stop-color="#1E2328"/>
      <stop offset="100%" stop-color="#181C20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDC28"/>
      <stop offset="100%" stop-color="#EFD01B"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#banner-bg)"/>
  <!-- Decorative pin-stripe lines -->
  <line x1="0" y1="12" x2="1544" y2="12" stroke="#FFDC28" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="488" x2="1544" y2="488" stroke="#FFDC28" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="16" x2="1544" y2="16" stroke="#FFDC28" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="484" x2="1544" y2="484" stroke="#FFDC28" stroke-width="1" opacity="0.2"/>
  <!-- Shield icon on left -->
  <g transform="translate(300, 250) scale(1.6)">
    <!-- Shield outline -->
    <path d="M0 -80 L68 -52 L68 20 Q68 72 0 100 Q-68 72 -68 20 L-68 -52 Z"
          fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner shield fill -->
    <path d="M0 -62 L52 -40 L52 14 Q52 56 0 80 Q-52 56 -52 14 L-52 -40 Z"
          fill="url(#accent)" opacity="0.12"/>
    <!-- Block/prohibition symbol -->
    <circle cx="0" cy="-2" r="30" fill="none" stroke="#FFDC28" stroke-width="5"/>
    <line x1="-21" y1="-23" x2="21" y2="19" stroke="#FFDC28" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Plugin name text -->
  <text x="772" y="230" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="2">Easy IP Blocker</text>
  <!-- Tagline -->
  <text x="772" y="290" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#FFDC28" opacity="0.85" letter-spacing="4">QUICKLY BLOCK UNWANTED IPS IN YOUR WP SITE</text>
  <!-- Decorative shield outlines on right -->
  <g transform="translate(1244, 250) scale(0.8)" opacity="0.15">
    <path d="M0 -80 L68 -52 L68 20 Q68 72 0 100 Q-68 72 -68 20 L-68 -52 Z"
          fill="none" stroke="#FFDC28" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1310, 220) scale(0.5)" opacity="0.1">
    <path d="M0 -80 L68 -52 L68 20 Q68 72 0 100 Q-68 72 -68 20 L-68 -52 Z"
          fill="none" stroke="#FFDC28" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
